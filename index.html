<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reality Building Materials — Cement Board Price List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#E4E1D8;
    --card:#F4F2EC;
    --ink:#201F1C;
    --ink-soft:#5B584F;
    --steel:#35526B;
    --steel-dark:#233B4E;
    --rust:#A8431E;
    --line:#B9B3A5;
    --line-soft:#D3CEC2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 3px);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, sans-serif;
    min-height:100vh;
    padding:32px 16px 60px;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
  }

  .band{
    background:var(--steel-dark);
    color:#EDEAE1;
    padding:22px 26px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }
  .band .mark{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:28px;
    letter-spacing:0.5px;
    line-height:1;
  }
  .band .mark span{color:#D8A98A;}
  .band .sub{
    font-size:12.5px;
    color:#C7CCD2;
    margin-top:6px;
    max-width:340px;
    line-height:1.5;
  }
  .band .updated{
    text-align:right;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:#C7CCD2;
  }
  .band .updated b{
    display:block;
    color:#EDEAE1;
    font-size:15px;
    font-weight:600;
    margin-top:3px;
  }

  .sync-bar{
    background:#F4F2EC;
    border:1px solid var(--line);
    border-top:none;
    padding:9px 26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .sync-bar.error{ background:#F3E4DE; color:#7A3218; }
  .sync-bar button{
    background:transparent;
    border:1px solid var(--ink-soft);
    color:var(--ink-soft);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:11px;
    font-weight:600;
    padding:4px 10px;
    cursor:pointer;
  }
  .sync-bar.error button{ border-color:#7A3218; color:#7A3218; }
  .sync-bar button:hover{ opacity:0.75; }

  .list-intro{
    padding:16px 2px 4px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
  }
  .list-intro h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:21px;
    margin:0;
  }
  .list-intro .unit{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
  }

  .brand-card{
    background:var(--card);
    border:1px solid var(--line);
    margin-top:14px;
  }
  .card-head{
    padding:16px 22px 12px;
    border-bottom:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .card-head .co-tag{
    font-size:10.5px;
    letter-spacing:0.3px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
  }
  .card-head h2{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:19px;
    margin:2px 0 0;
    color:var(--steel-dark);
  }
  .card-head .card-date{
    text-align:right;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  table{
    width:100%;
    border-collapse:collapse;
  }
  thead th{
    text-align:left;
    font-size:11px;
    font-weight:600;
    color:var(--ink-soft);
    padding:9px 22px;
    border-bottom:1px solid var(--line);
  }
  thead th.num{ text-align:right; }

  tbody tr.item-row td{
    padding:10px 22px;
    border-bottom:1px solid var(--line-soft);
    font-size:14.5px;
  }
  tbody tr.item-row:last-of-type td{
    border-bottom:none;
  }
  td.size{
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  td.price{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:15.5px;
    text-align:right;
  }
  td.price .cur{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:500;
    margin-right:3px;
  }
  td.price.na{
    color:var(--ink-soft);
    font-weight:500;
    font-size:13px;
    font-style:italic;
    text-align:right;
  }

  .card-foot{
    padding:12px 22px 16px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:8px;
    border-top:1px solid var(--line-soft);
  }
  .card-foot .co{
    font-size:11.5px;
    line-height:1.55;
    color:var(--ink-soft);
  }
  .card-foot .co b{ color:var(--ink); }
  .card-foot .price-note{
    font-size:10.5px;
    color:var(--ink-soft);
    max-width:190px;
    text-align:right;
    line-height:1.4;
  }

  .brand-controls{
    display:flex;
    justify-content:flex-end;
    padding:8px 2px 0;
  }
  .brand-controls button{
    background:transparent;
    color:var(--steel-dark);
    border:1px solid var(--steel-dark);
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:12px;
    padding:7px 14px;
    cursor:pointer;
    letter-spacing:0.2px;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .brand-controls button:hover{ background:var(--steel-dark); color:#EDEAE1; }
  .brand-controls button:disabled{ opacity:0.5; cursor:progress; }

  .all-controls{
    display:flex;
    justify-content:flex-end;
    padding:20px 2px 0;
  }
  button#downloadAllBtn{
    background:var(--rust);
    color:#F4F2EC;
    border:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:11px 20px;
    cursor:pointer;
    letter-spacing:0.2px;
    transition:background 0.15s ease;
  }
  button#downloadAllBtn:hover{ background:#8C3717; }
  button#downloadAllBtn:disabled{ background:#B9AFA5; cursor:progress; }

  @media (max-width:480px){
    .card-head, thead th, tbody tr.item-row td, .card-foot, .sync-bar{
      padding-left:16px;
      padding-right:16px;
    }
    .band{ padding:18px 16px; }
  }

  /* ---- PIN lock screen ---- */
  #lockScreen{
    position:fixed;
    inset:0;
    background:var(--steel-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
  }
  #lockScreen.hidden{ display:none; }
  .lock-box{
    background:var(--card);
    border:1px solid var(--line);
    padding:34px 30px;
    max-width:320px;
    width:100%;
    text-align:center;
  }
  .lock-box .mark{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:20px;
    color:var(--steel-dark);
    letter-spacing:0.3px;
    margin-bottom:4px;
  }
  .lock-box .mark span{ color:var(--rust); }
  .lock-box p{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 20px;
  }
  #pinInput{
    width:100%;
    font-family:'IBM Plex Mono', monospace;
    font-size:22px;
    letter-spacing:10px;
    text-align:center;
    padding:12px 10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    box-sizing:border-box;
  }
  #pinError{
    font-size:12px;
    color:var(--rust);
    margin-top:10px;
    min-height:16px;
  }
  #pinSubmit{
    width:100%;
    margin-top:16px;
    background:var(--steel);
    color:#F4F2EC;
    border:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:11px 20px;
    cursor:pointer;
    letter-spacing:0.2px;
  }
  #pinSubmit:hover{ background:var(--steel-dark); }

  body.locked > .wrap,
  body.locked #captureAll{
    display:none;
  }
</style>
</head>
<body class="locked">

<div id="lockScreen">
  <div class="lock-box">
    <div class="mark">REALITY <span>BUILDING MATERIALS</span></div>
    <p>Enter the 6-digit PIN to view prices.</p>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
    <div id="pinError"></div>
    <button id="pinSubmit">Unlock</button>
  </div>
</div>

<div class="wrap">

  <div class="band">
    <div>
      <div class="mark">REALITY <span>BUILDING MATERIALS</span></div>
      <div class="sub">Trading LLC — Al Quoz Dubai · Sajaa Sharjah · Fujairah</div>
    </div>
    <div class="updated">PRICES UPDATED<b id="updatedDate">—</b></div>
  </div>

  <div class="sync-bar" id="syncBar">
    <span id="syncStatus">Loading latest prices…</span>
    <button id="refreshBtn">Refresh</button>
  </div>

  <div class="list-intro">
    <h1>Cement Board — Price List</h1>
    <div class="unit">AED per sheet, ex-showroom</div>
  </div>

  <div id="brandCards"></div>

  <div class="all-controls">
    <button id="downloadAllBtn">Download full price list (JPG)</button>
  </div>

</div>

<div id="captureAll" style="position:absolute; left:-9999px; top:0; width:760px;"></div>

<script>
  // ---------------------------------------------------------------
  // Prices are pulled live from a published Google Sheet tab (CSV),
  // with columns: Brand, Size, Price. Blank price -> "On request".
  // Update prices by editing that sheet — this page just displays
  // whatever it last fetched from there.
  // ---------------------------------------------------------------
  const SHEET_DOC_KEY = "2PACX-1vRga_4VlPWTqDrLG4ooGHgok1kgVHn2iN-zUXPEsgnjsmUY9INu_m0tywddVORvZJteM7ZmryuT8Q8d";
  const SHEET_GID = "118355134";
  const CSV_URL = `https://docs.google.com/spreadsheets/d/e/${SHEET_DOC_KEY}/pub?gid=${SHEET_GID}&single=true&output=csv`;

  const SITE_PIN = "786110";
  const PIN_SESSION_KEY = 'realitybm_pin_ok_v1';
  const CACHE_KEY = 'realitybm_price_cache_v1';
  const CONTACT_HTML = `showroom@realitybm.com<br>+971 56 500 3029 · +971 56 680 3874`;

  let state = { date: "—", data: [] };

  // ---- CSV parsing ----
  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field = ''; }
        else if(c === '\n' || c === '\r'){
          if(field !== '' || row.length){ row.push(field); rows.push(row); }
          field = ''; row = [];
          if(c === '\r' && text[i+1] === '\n') i++;
        } else field += c;
      }
    }
    if(field !== '' || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  // Finds the header row by looking for cells containing "brand" /
  // "size" / "price" anywhere in the sheet, then reads data from
  // whichever columns those headers sit in — so it doesn't matter
  // if there are blank leading rows/columns (as in this sheet, where
  // headers are on row 4 and column A is empty).
  function findColumns(rows){
    for(let i = 0; i < rows.length; i++){
      const row = rows[i];
      let brandCol = -1, sizeCol = -1, priceCol = -1;
      row.forEach((cell, idx) => {
        const c = (cell || '').trim().toLowerCase();
        if(c.includes('brand')) brandCol = idx;
        else if(c.includes('size')) sizeCol = idx;
        else if(c.includes('price')) priceCol = idx;
      });
      if(brandCol !== -1 && sizeCol !== -1 && priceCol !== -1){
        return { headerRow: i, brandCol, sizeCol, priceCol };
      }
    }
    return null;
  }

  function rowsToState(rows){
    const nonEmptyRows = rows.filter(r => r.some(c => (c || '').trim() !== ''));
    const cols = findColumns(nonEmptyRows);
    if(!cols) return [];

    const dataRows = nonEmptyRows.slice(cols.headerRow + 1);
    const groups = [];
    const byBrand = {};
    let lastBrand = '';

    dataRows.forEach(r => {
      const brandRaw = (r[cols.brandCol] || '').trim();
      const size = (r[cols.sizeCol] || '').trim();
      const priceRaw = (r[cols.priceCol] || '').trim();
      if(!size) return;
      const brand = brandRaw || lastBrand;
      lastBrand = brand;
      if(!brand) return;

      if(!byBrand[brand]){
        byBrand[brand] = { brand, items: [] };
        groups.push(byBrand[brand]);
      }
      const num = parseFloat(priceRaw.replace(/[^0-9.\-]/g, ''));
      byBrand[brand].items.push({
        size,
        price: (priceRaw === '' || isNaN(num)) ? null : num
      });
    });

    return groups;
  }

  function todayLabel(){
    return new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function setSyncStatus(msg, isError){
    const bar = document.getElementById('syncBar');
    document.getElementById('syncStatus').textContent = msg;
    bar.classList.toggle('error', !!isError);
  }

  function saveCache(data){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ date: todayLabel(), data })); }catch(e){}
  }
  function loadCache(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  async function fetchPrices(){
    setSyncStatus('Loading latest prices…', false);
    try{
      const res = await fetch(CSV_URL, { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const groups = rowsToState(parseCSV(text));
      if(!groups.length) throw new Error('No rows found');
      state = { date: todayLabel(), data: groups };
      saveCache(groups);
      setSyncStatus('Synced from Google Sheet · ' + state.date, false);
      renderPriceList();
    }catch(err){
      console.error('Price sheet fetch failed:', err);
      const cached = loadCache();
      if(cached && cached.data && cached.data.length){
        state = cached;
        setSyncStatus('Could not reach the price sheet — showing last saved prices (' + cached.date + ')', true);
      } else {
        setSyncStatus('Could not load prices. Check your connection and hit Refresh.', true);
      }
      renderPriceList();
    }
  }

  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

  function tableRowsHTML(items){
    return items.map(item => {
      const priceCell = (item.price === null || item.price === undefined)
        ? `<td class="price na">On request</td>`
        : `<td class="price"><span class="cur">AED</span>${Number(item.price).toFixed(2)}</td>`;
      return `<tr class="item-row"><td class="size">${item.size}</td>${priceCell}</tr>`;
    }).join('');
  }

  function brandCardHTML(group, id){
    return `
      <div class="brand-card" id="${id}">
        <div class="card-head">
          <div>
            <div class="co-tag">REALITY BUILDING MATERIALS TRADING LLC</div>
            <h2>${group.brand} — Cement Board</h2>
          </div>
          <div class="card-date">AED / sheet<br>${state.date}</div>
        </div>
        <table>
          <thead><tr><th>Size</th><th class="num">Price</th></tr></thead>
          <tbody>${tableRowsHTML(group.items)}</tbody>
        </table>
        <div class="card-foot">
          <div class="co"><b>Reality Building Materials</b><br>${CONTACT_HTML}</div>
          <div class="price-note">Prices subject to change. Contact us for bulk / trader rates.</div>
        </div>
      </div>
    `;
  }

  function renderPriceList(){
    document.getElementById('updatedDate').textContent = state.date;

    const container = document.getElementById('brandCards');
    container.innerHTML = '';
    state.data.forEach(group => {
      const id = 'capture-' + slug(group.brand);
      const wrap = document.createElement('div');
      wrap.innerHTML = brandCardHTML(group, id);
      container.appendChild(wrap.firstElementChild);

      const controls = document.createElement('div');
      controls.className = 'brand-controls';
      const btn = document.createElement('button');
      btn.textContent = `Download ${group.brand} (JPG)`;
      btn.addEventListener('click', () => downloadElementAsJPG(id, `realitybm-${slug(group.brand)}-prices`, btn));
      controls.appendChild(btn);
      container.appendChild(controls);
    });

    const captureAll = document.getElementById('captureAll');
    captureAll.innerHTML = `
      <div style="background:#F4F2EC; font-family:'IBM Plex Sans', sans-serif;">
        <div style="padding:16px 22px 4px;">
          <div style="font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:24px; color:#233B4E;">REALITY <span style="color:#A8431E;">BUILDING MATERIALS</span></div>
          <div style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:#5B584F; margin-top:4px;">Cement Board — Price List · Updated ${state.date}</div>
        </div>
        ${state.data.map(group => `
          <div style="border-top:2px solid #201F1C; margin-top:10px; padding-top:8px;">
            <h2 style="font-family:'Big Shoulders Display', sans-serif; font-size:17px; color:#233B4E; margin:6px 22px;">${group.brand}</h2>
            <table style="width:100%; border-collapse:collapse;">
              <tbody>${group.items.map(item => {
                const priceInner = (item.price === null || item.price === undefined)
                  ? `<span style="font-style:italic; color:#5B584F; font-size:13px;">On request</span>`
                  : `<span style="font-family:'IBM Plex Mono', monospace; font-weight:600;"><span style="font-size:11px; color:#5B584F; margin-right:3px;">AED</span>${Number(item.price).toFixed(2)}</span>`;
                return `<tr>
                  <td style="padding:8px 22px; font-family:'IBM Plex Mono', monospace; color:#5B584F; font-size:13.5px; border-bottom:1px solid #D3CEC2;">${item.size}</td>
                  <td style="padding:8px 22px; text-align:right; border-bottom:1px solid #D3CEC2;">${priceInner}</td>
                </tr>`;
              }).join('')}</tbody>
            </table>
          </div>
        `).join('')}
        <div style="padding:16px 22px 20px; font-size:11.5px; color:#5B584F; line-height:1.6; border-top:1px solid #D3CEC2; margin-top:6px;">
          <b style="color:#201F1C;">Reality Building Materials Trading LLC</b><br>${CONTACT_HTML}
        </div>
      </div>
    `;
  }

  async function downloadElementAsJPG(elementId, filenameBase, btn){
    const originalLabel = btn ? btn.textContent : null;
    if(btn){ btn.disabled = true; btn.textContent = 'Preparing...'; }
    try {
      const target = document.getElementById(elementId);
      const canvas = await html2canvas(target, { backgroundColor: '#F4F2EC', scale: 2 });
      const link = document.createElement('a');
      const dateSlug = state.date.replace(/\s+/g, '-');
      link.download = `${filenameBase}-${dateSlug}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    } catch (e) {
      alert('Could not generate the image. Please try again.');
      console.error(e);
    } finally {
      if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
    }
  }

  document.getElementById('downloadAllBtn').addEventListener('click', (e) => {
    downloadElementAsJPG('captureAll', 'realitybm-all-brands-prices', e.currentTarget);
  });
  document.getElementById('refreshBtn').addEventListener('click', fetchPrices);

  // ---- PIN gate ----
  function tryUnlock(value){
    const errEl = document.getElementById('pinError');
    if (value === SITE_PIN){
      document.body.classList.remove('locked');
      document.getElementById('lockScreen').classList.add('hidden');
      try{ sessionStorage.setItem(PIN_SESSION_KEY, '1'); }catch(e){}
      errEl.textContent = '';
    } else {
      errEl.textContent = 'Incorrect PIN — try again.';
      document.getElementById('pinInput').value = '';
      document.getElementById('pinInput').focus();
    }
  }
  document.getElementById('pinSubmit').addEventListener('click', () => {
    tryUnlock(document.getElementById('pinInput').value.trim());
  });
  document.getElementById('pinInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryUnlock(e.target.value.trim());
  });
  try{
    if (sessionStorage.getItem(PIN_SESSION_KEY) === '1'){
      document.body.classList.remove('locked');
      document.getElementById('lockScreen').classList.add('hidden');
    }
  }catch(e){}

  fetchPrices();
</script>

</body>
</html>
